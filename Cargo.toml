sc-service = { git = "https://github.com/paritytech/polkadot-sdk", tag = "polkadot-stable2606-2", default-features = false }
sc-telemetry = { git = "https://github.com/paritytech/polkadot-sdk", tag = "polkadot-stable2606-2" }
sc-transaction-pool = { git = "https://github.com/paritytech/polkadot-sdk", tag = "polkadot-stable2606-2" }

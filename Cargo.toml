[workspace.package]
license = "MIT-0"
authors = ["Parity Technologies <admin@parity.io>"]
homepage = "https://paritytech.github.io/polkadot-sdk/"
repository = "https://github.com/paritytech/polkadot-sdk-solochain-template.git"
edition = "2021"

[workspace]
members = [
    "node",
    "pallets/*",
    "runtime",
]
resolver = "2"

[workspace.dependencies]
clap = { version = "4.5.13", features = ["derive", "deprecated"] }
futures = "0.3.31"
impl-serde = { version = "0.5.0", default-features = false }
jsonrpsee = { version = "0.24.11" }
log = { version = "0.4.22", default-features = false }
scale-codec = { package = "parity-scale-codec", version = "3.7.5", default-features = false, features = ["derive"] }
codec = { version = "3.7.5", default-features = false, package = "parity-scale-codec" }
scale-info = { version = "2.11.6", default-features = false, features = ["derive"] }
serde = { version = "1.0", default-features = false, features = ["derive", "alloc"] }
serde_json = { version = "1.0.132", default-features = false }
bs58 = { version = "0.5", default-features = false }
libm = "0.2.8"
docify = { version = "0.2.7" }

hypertensor-runtime = { path = "./runtime", default-features = false }
pallet-atomic-swap = { path = "./pallets/atomic-swap", default-features = false }
pallet-collective = { path = "./pallets/collective", default-features = false }
pallet-network = { path = "./pallets/network", default-features = false }
pallet-randomness = { path = "./pallets/randomness", default-features = false }
network-rpc-types = { path = "./pallets/network-rpc-types", default-features = false }
network-custom-rpc = { path = "./pallets/network/rpc", default-features = false }
network-custom-rpc-runtime-api = { path = "./pallets/network/runtime-api", default-features = false }

# Substrate Client
sc-basic-authorship = { git = "https://github.com/paritytech/polkadot-sdk", tag = "polkadot-stable2606-2" }
sc-chain-spec = { git = "https://github.com/paritytech/polkadot-sdk", tag = "polkadot-stable2606-2" }
sc-cli = { git = "https://github.com/paritytech/polkadot-sdk", tag = "polkadot-stable2606-2", default-features = false }
sc-client-api = { git = "https://github.com/paritytech/polkadot-sdk", tag = "polkadot-stable2606-2" }
sc-consensus = { git = "https://github.com/paritytech/polkadot-sdk", tag = "polkadot-stable2606-2" }
sc-consensus-babe = { git = "https://github.com/paritytech/polkadot-sdk", tag = "polkadot-stable2606-2" }

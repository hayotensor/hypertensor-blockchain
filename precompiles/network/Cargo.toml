[package]
name = "network-precompiles"
version = "0.1.0"
edition.workspace = true
license = "Apache-2.0"
publish = false

[dependencies]
codec.workspace = true
scale-info.workspace = true
frame-support.workspace = true
frame-system.workspace = true
frame-benchmarking = { workspace = true, optional = true }
pallet-network.workspace = true
pallet-revive.workspace = true
network-rpc-types.workspace = true
sp-core.workspace = true
sp-runtime.workspace = true

[dev-dependencies]
serde_json.workspace = true

[features]
default = ["std"]
std = ["codec/std", "scale-info/std", "frame-support/std", "frame-system/std", "frame-benchmarking?/std", "pallet-network/std", "pallet-revive/std", "network-rpc-types/std", "sp-core/std", "sp-runtime/std"]
runtime-benchmarks = ["frame-benchmarking/runtime-benchmarks", "frame-support/runtime-benchmarks", "frame-system/runtime-benchmarks", "pallet-network/runtime-benchmarks", "pallet-revive/runtime-benchmarks"]
try-runtime = ["frame-support/try-runtime", "frame-system/try-runtime", "pallet-network/try-runtime", "pallet-revive/try-runtime"]
